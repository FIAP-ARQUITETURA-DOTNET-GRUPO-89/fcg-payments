version: "3.9"

services:
  payments-db:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5533:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payments-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  payments-api:
    build:
      context: .
      dockerfile: src/FcgPayments.Api/Dockerfile
    container_name: payments-api
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=payments-db;Port=5432;Database=payments;Username=payments;Password=payments"
      ConnectionStrings__rabbitmq: "amqp://guest:guest@rabbitmq:5672"
      JwtSettings__Issuer: "FcgCatalog-Issuer"
      JwtSettings__SecurityKey: "FcgCatalog_Secret_Key_2026_High_Security_Token"
      JwtSettings__ExpirationHours: "2"
      PaymentSimulation__ApprovalRate: "1.0"
    ports:
      - "8081:8080"

  payments-worker:
    build:
      context: .
      dockerfile: src/FcgPayments.Worker/Dockerfile
    container_name: payments-worker
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=payments-db;Port=5432;Database=payments;Username=payments;Password=payments"
      ConnectionStrings__rabbitmq: "amqp://guest:guest@rabbitmq:5672"
      PaymentSimulation__ApprovalRate: "1.0"

volumes:
  payments-db-data:
