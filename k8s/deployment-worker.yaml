apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: fcg
  labels:
    app: payments-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      containers:
        - name: payments-worker
          image: fcgpayments/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
