apiVersion: apps/v1
kind: Deployment

metadata:
  name: fcg-payments-api
  namespace: fcg-platform

  labels:
    app.kubernetes.io/name: fcg-payments-api
    app.kubernetes.io/instance: fcg-payments-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl

spec:
  replicas: 1

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-payments-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-payments-api
        app.kubernetes.io/instance: fcg-payments-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fcg-platform

    spec:
      containers:
        - name: fcg-payments-api
          image: camilamachado22/fcg-users-api:1.0.0-preview.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7040
          envFrom:
            - configMapRef:
                name: fcg-payments-api-config
            - secretRef:
                name: fcg-payments-api-secret
          env:
            # Define se as migrations do EF Core serão executadas no startup da aplicação
            - name: RUN_MIGRATION
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 7040
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 7040
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
